<!doctype html>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Fraunces";
    src: url("FONT_URL");
    font-weight: 700;
  }
  html,
  body {
    margin: 0;
    width: 1024px;
    height: 500px;
  }
  .plate {
    width: 1024px;
    height: 500px;
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, #fdeeec 0%, #f7cac5 100%);
    display: grid;
    place-items: center;
  }
  /* The same warm upper-trailing glow every Saydle surface carries. */
  .plate::before {
    content: "";
    position: absolute;
    width: 1100px;
    height: 1100px;
    border-radius: 50%;
    top: -560px;
    right: -320px;
    background: radial-gradient(
      circle,
      rgba(253, 238, 236, 0.9) 0%,
      rgba(253, 238, 236, 0) 70%
    );
  }
  .lockup {
    position: relative;
    z-index: 1;
    text-align: center;
    color: #38223a;
  }
  .word {
    font-family: "Fraunces";
    font-weight: 700;
    font-size: 150px;
    line-height: 1;
  }
  .line {
    font-family: "Fraunces";
    font-weight: 700;
    font-size: 34px;
    margin-top: 18px;
    opacity: 0.75;
  }
</style>
<body>
  <div class="plate">
    <div class="lockup">
      <div class="word">Saydle</div>
      <div class="line">One new affirmation every morning, written for you.</div>
    </div>
  </div>
</body>
